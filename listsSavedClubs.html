<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8"/>
        <title>UNT GET INVOLVED - Saved Clubs</title>
    </head>

    <body>
        <!-- Header -->
        <header>
            <h1>UNT Campus Involvement</h1>

            <nav>
                <a href="genre_serach.html">Genre Search</a>
                <a href="calender.html">Calendar</a>
                <a href="Explore.html">Home</a>
                <a href="loginsignup.html" class="btn">Login / Signin</a>
            </nav>
        </header>

        <hr>

        <!--Page Title-->
        <section>
            <h1>Saved Clubs</h1>
            <h3>Look back clubs whenever you want</h3>
        </section>

        <hr>
        
        <!--ID-->
        <section id="saved-clubs-container"></section>

        <!-- script to connect savedEvents.js HERE-->
        <script>
            document.addEventListener("DOMContentLoaded", async () => {
                const container = document.getElementById("saved-clubs-container");

                try {
                    const response = await fetch("/saved"); // calls your Express route
                    const events = await response.json();

                    if (events.length === 0) {
                        container.innerHTML = "<p>No saved clubs yet.</p>";
                        return;
                    }

                    events.forEach(event => {
                        const div = document.createElement("div");

                        div.innerHTML = `
                            <h2>${event.name || "Unnamed Event"}</h2>
                            <p>${event.description || ""}</p>
                            <p><strong>Date:</strong> ${event.date || "N/A"}</p>
                        `;

                        container.appendChild(div);
                    });

                } catch (err) {
                    container.innerHTML = "<p>Error loading saved clubs.</p>";
                    console.error(err);
                }
            });
    </script>



    </body>
